<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>단어 암기</title>
<meta name="theme-color" content="#1d6e5a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f6f4ef; --card: #fff; --ink: #2c2c2a; --sub: #6b6a64; --line: #e3e0d8;
    --accent: #1d6e5a; --accent-soft: #e1f0ea;
    --warn: #b8542e; --warn-soft: #f8e9e2;
    --blue: #2d6aa3; --blue-soft: #e6effa;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.6; }
  #app { max-width: 520px; margin: 0 auto; padding: 16px 16px 96px; }

  header.top { display: flex; align-items: baseline; justify-content: space-between; padding: 8px 2px 14px; }
  header.top h1 { font-size: 20px; font-weight: 700; }
  header.top .streak { font-size: 14px; color: var(--sub); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
  .card h2 { font-size: 15px; font-weight: 700; margin-bottom: 10px; color: var(--sub); }

  .btn { font-family: inherit; font-size: 16px; font-weight: 700; padding: 14px; border-radius: 12px; border: none; cursor: pointer; width: 100%; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.blue { background: var(--blue); color: #fff; }
  .btn.ghost { background: var(--card); border: 1px solid var(--line); color: var(--ink); }
  .btn.warn { background: var(--warn-soft); color: var(--warn); }
  .btn:disabled { opacity: .45; cursor: default; }
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }

  .hero { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
  .hero .label { font-size: 13px; color: var(--sub); }
  .hero .title { font-size: 18px; font-weight: 700; margin: 2px 0 12px; }
  .hero .count { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
  .hero .count b { font-size: 30px; font-weight: 800; color: var(--accent); }
  .bar { height: 9px; background: var(--line); border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 5px; transition: width .3s; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { border: none; border-radius: var(--radius); padding: 16px 14px; text-align: left; cursor: pointer; font-family: inherit; }
  .tile .num { font-size: 26px; font-weight: 800; display: block; line-height: 1.2; }
  .tile .lbl { font-size: 13px; }
  .tile.rev { background: var(--blue-soft); color: var(--blue); }
  .tile.shot { background: var(--accent-soft); color: var(--accent); }
  .tile:disabled { opacity: .45; cursor: default; }

  nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
    border-top: 1px solid var(--line); display: flex; justify-content: space-around;
    padding: 8px 0 max(8px, env(safe-area-inset-bottom)); z-index: 10; }
  nav.tabs button { background: none; border: none; font-family: inherit; font-size: 11px;
    color: var(--sub); cursor: pointer; padding: 4px 10px; }
  nav.tabs button .ico { display: block; font-size: 19px; }
  nav.tabs button.on { color: var(--accent); font-weight: 700; }

  .session-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; color: var(--sub); }
  .session-head button { background: none; border: none; color: var(--sub); font-family: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
  .progress i { display: block; height: 100%; background: var(--accent); transition: width .25s; }

  .word-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 18px; text-align: center; }
  .step-tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-bottom: 12px; }
  .step-tag.b { background: var(--blue-soft); color: var(--blue); }
  .word { font-size: 33px; font-weight: 800; letter-spacing: .3px; word-break: break-word; }
  .ipa { font-size: 14px; color: var(--sub); margin-top: 2px; }
  .pos { font-size: 13px; color: var(--sub); }
  .example { font-size: 16px; margin-top: 13px; }
  .example b { color: var(--accent); }
  .meaning { font-size: 22px; font-weight: 700; margin-top: 12px; color: var(--accent); }
  .hint { font-size: 14px; color: var(--sub); margin-top: 10px; background: var(--bg); border-radius: 10px; padding: 10px 12px; display: inline-block; text-align: left; }
  .speak-btn { border: 1px solid var(--line); background: var(--card); border-radius: 999px; font-size: 20px; width: 46px; height: 46px; cursor: pointer; margin-top: 13px; }
  .speak-btn:active { background: var(--accent-soft); }
  .mstars { margin-top: 10px; font-size: 15px; letter-spacing: 3px; color: var(--accent); }

  .say-counter { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
  .say-dot { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line);
    display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--sub); }
  .say-dot.done { background: var(--accent); border-color: var(--accent); color: #fff; }

  .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .choice { font-family: inherit; text-align: left; font-size: 16px; padding: 13px 15px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); cursor: pointer; width: 100%; }
  .choice.right { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .choice.wrong { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }

  .summary { text-align: center; padding: 26px 10px; }
  .summary .emoji { font-size: 46px; }
  .summary h2 { font-size: 20px; margin: 10px 0 6px; color: var(--ink); }
  .summary p { color: var(--sub); font-size: 14px; }

  /* 촬영 / 확인 */
  .shot-zone { border: 2px dashed var(--line); border-radius: var(--radius); padding: 34px 18px; text-align: center; background: var(--card); }
  .shot-zone .big { font-size: 46px; }
  .shot-zone p { color: var(--sub); font-size: 14px; margin-top: 6px; }
  .loading { text-align: center; padding: 40px 16px; }
  .spinner { width: 40px; height: 40px; margin: 0 auto 16px; border: 4px solid var(--line);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .edit-row { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .edit-row .line { display: flex; gap: 7px; align-items: center; }
  .edit-row .line + .line { margin-top: 6px; }
  .edit-row input { font-family: inherit; font-size: 15px; padding: 8px 9px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--card); color: var(--ink); min-width: 0; flex: 1; }
  .edit-row .w { font-weight: 700; }
  .edit-row .m.empty { border-color: var(--warn); background: var(--warn-soft); }
  .edit-row .dic { flex: 0 0 auto; background: var(--blue-soft); color: var(--blue); border: none;
    font-family: inherit; font-size: 13px; font-weight: 700; padding: 9px 11px; border-radius: 8px;
    cursor: pointer; text-decoration: none; white-space: nowrap; }
  .edit-row .del { flex: 0 0 32px; background: none; border: none; color: var(--warn); font-size: 18px; cursor: pointer; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .stat .v { font-size: 25px; font-weight: 800; }
  .stat .k { font-size: 12px; color: var(--sub); }

  .listrow { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .listrow:last-child { border-bottom: none; }
  .listrow .info { flex: 1; min-width: 0; }
  .listrow .nm { font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .listrow .sub { font-size: 12px; color: var(--sub); }
  .listrow .go { background: var(--accent-soft); color: var(--accent); border: none; font-family: inherit;
    font-size: 13px; font-weight: 700; padding: 8px 13px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
  .listrow .go.gray { background: var(--bg); color: var(--sub); }

  .setting-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .setting-row:last-child { border-bottom: none; }
  select, input[type=number], input[type=password], input[type=text] { font-family: inherit; font-size: 15px;
    padding: 8px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
  .muted { color: var(--sub); font-size: 13px; }
  .danger-link { color: var(--warn); background: none; border: none; font-family: inherit; font-size: 14px; text-decoration: underline; cursor: pointer; padding: 0; }
  .notice { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 11px 13px; font-size: 14px; margin-bottom: 12px; }
  .ok-notice { background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 11px 13px; font-size: 14px; margin-bottom: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>

<script src="data/set_a.js"></script>
<script src="data/set_a1.js"></script>
<script src="data/set_b.js"></script>
<script src="data/set_b1.js"></script>
<script src="data/set_c.js"></script>
<script src="data/set_c1.js"></script>
<script src="data/set_d.js"></script>
<script src="data/set_d1.js"></script>
<script src="data/set_e.js"></script>
<script src="data/set_e1.js"></script>
<script src="data/set_f.js"></script>

<script>
"use strict";

/* ========== 내장 자료 ========== */
const BUILTIN_ORDER = ["A","A1","B","B1","C","C1","D","D1","E","E1","F"];
const BUILTIN = window.VOCAB_DATA || {};
const DICT = {};   // 자동완성 사전: word(소문자) -> {m,p,e,h}
for (const sid of BUILTIN_ORDER) {
  const s = BUILTIN[sid]; if (!s) continue;
  for (const c of s.cards) if (!DICT[c.w.toLowerCase()]) DICT[c.w.toLowerCase()] = { m: c.m, p: c.p, e: c.e, h: c.h };
}

/* ========== 저장소 ========== */
const KEY = "vocab-app-v2";
let S = load();
function load() {
  try { const r = localStorage.getItem(KEY); if (r) return migrate(JSON.parse(r)); } catch (e) {}
  return fresh();
}
function fresh() {
  return {
    settings: { newPerDay: 10, ttsRate: 0.9, mastery: 3, useDictApi: true, geminiKey: "", geminiModel: "" },
    batches: {},        // id -> {id,name,created,cards:[{w,m,p,e,h,ipa,audio}],done,doneAt}
    active: null,       // 현재 학습 중 묶음 id
    prog: {},           // "batchId#idx" -> {seen,streak,mastered,iv,due,ef,reps,lapses}
    userDict: {},       // 사용자가 입력/생성한 단어 누적
    streak: 0, lastDay: null, newDay: null, newCount: 0,
  };
}
function migrate(s) { const f = fresh(); return { ...f, ...s, settings: { ...f.settings, ...(s.settings || {}) } }; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { alert("저장 공간이 부족합니다. 보관함에서 오래된 묶음을 삭제해 주세요."); } }
function dstr(d) { return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function today() { return dstr(new Date()); }
function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return dstr(d); }
function lookup(w) { const k = w.toLowerCase().trim(); return S.userDict[k] || DICT[k] || null; }

function touchStreak() {
  const t = today(); if (S.lastDay === t) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  S.streak = (S.lastDay === dstr(y)) ? S.streak + 1 : 1;
  S.lastDay = t; save();
}
function newLeft() {
  if (S.newDay !== today()) { S.newDay = today(); S.newCount = 0; save(); }
  return Math.max(0, S.settings.newPerDay - S.newCount);
}

/* ========== 묶음 / 진행도 ========== */
function P(bid, i) {
  const k = bid + "#" + i;
  if (!S.prog[k]) S.prog[k] = { seen: false, streak: 0, mastered: false, iv: 0, due: null, ef: 2.5, reps: 0, lapses: 0 };
  return S.prog[k];
}
function batchStats(b) {
  let mastered = 0, seen = 0;
  b.cards.forEach((c, i) => { const p = S.prog[b.id + "#" + i]; if (p) { if (p.mastered) mastered++; if (p.seen) seen++; } });
  return { total: b.cards.length, mastered, seen, left: b.cards.length - mastered };
}
function activeBatch() { return S.active ? S.batches[S.active] : null; }

const LADDER = [1, 3, 7, 30];
function gradeReview(bid, i, correct) {
  const p = P(bid, i);
  if (correct) {
    p.reps++;
    const idx = LADDER.indexOf(p.iv);
    if (p.iv === 0) p.iv = 1;
    else if (idx >= 0 && idx < LADDER.length - 1) p.iv = LADDER[idx + 1];
    else p.iv = Math.round(p.iv * p.ef);
    p.ef = Math.min(2.8, p.ef + 0.05);
  } else {
    p.lapses++; p.iv = 1; p.ef = Math.max(1.3, p.ef - 0.2);
  }
  p.due = addDays(p.iv); save();
}
function dueList() {
  const t = today(), out = [];
  for (const b of Object.values(S.batches)) {
    if (!b.done) continue;
    b.cards.forEach((c, i) => { const p = S.prog[b.id + "#" + i]; if (p && p.due && p.due <= t) out.push({ b, i, c }); });
  }
  return out;
}
function finishBatch(b) {
  b.done = true; b.doneAt = today();
  b.cards.forEach((c, i) => { const p = P(b.id, i); if (!p.due) { p.iv = 1; p.due = addDays(1); } });
  if (S.active === b.id) S.active = null;
  save();
}

/* ========== 발음 ========== */
let VOICE = null;
function pickVoice() { const v = speechSynthesis.getVoices().filter(x => x.lang && x.lang.startsWith("en")); VOICE = v.find(x => x.lang === "en-US") || v[0] || null; }
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let AUDIO = null;
function speak(text, audioUrl) {
  if (audioUrl) {
    try { if (AUDIO) AUDIO.pause(); AUDIO = new Audio(audioUrl); AUDIO.play().catch(() => ttsSpeak(text)); return; } catch (e) {}
  }
  ttsSpeak(text);
}
function ttsSpeak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/\(.*?\)/g, "").split("/")[0].trim());
  u.lang = "en-US"; if (VOICE) u.voice = VOICE; u.rate = S.settings.ttsRate;
  speechSynthesis.speak(u);
}

/* ========== 영어 사전 API (무료, 키 불필요) ========== */
async function fetchEnInfo(word) {
  if (!S.settings.useDictApi) return null;
  try {
    const r = await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(word.split("/")[0].trim()));
    if (!r.ok) return null;
    const j = await r.json(); const e = j[0]; if (!e) return null;
    return {
      ipa: (e.phonetics.find(p => p.text) || {}).text || "",
      audio: (e.phonetics.find(p => p.audio) || {}).audio || "",
    };
  } catch (e) { return null; }
}
async function enrichBatch(b) {
  for (let i = 0; i < b.cards.length; i++) {
    const c = b.cards[i];
    if (c.ipa !== undefined) continue;
    const info = await fetchEnInfo(c.w);
    c.ipa = info ? info.ipa : ""; c.audio = info ? info.audio : "";
    if (i % 10 === 0) save();
  }
  save();
}

/* ========== 제미나이로 뜻 자동 채우기 (무료 등급) ========== */
const GEM_BASE = "https://generativelanguage.googleapis.com/v1beta";
const GEM_SCHEMA = {
  type: "ARRAY",
  items: {
    type: "OBJECT",
    properties: { w: {type:"STRING"}, m: {type:"STRING"}, p: {type:"STRING"}, e: {type:"STRING"}, h: {type:"STRING"} },
    required: ["w","m","p","e","h"]
  }
};

async function gemPickModel(key) {
  const r = await fetch(GEM_BASE + "/models?key=" + encodeURIComponent(key));
  if (!r.ok) {
    if (r.status === 400 || r.status === 403) throw new Error("KEYBAD");
    throw new Error("모델 목록을 불러오지 못했습니다 (" + r.status + ")");
  }
  const j = await r.json();
  const usable = (j.models || []).filter(m =>
    (m.supportedGenerationMethods || []).indexOf("generateContent") >= 0 &&
    /flash/i.test(m.name) && !/vision|embedding|image|tts|live/i.test(m.name));
  usable.sort((a, b) => {
    const s = (n) => (/lite/i.test(n) ? 0 : 1) * 10 + (parseFloat((n.match(/(\d+\.\d+)/) || [0,0])[1]) || 0);
    return s(b.name) - s(a.name);
  });
  if (!usable.length) throw new Error("사용 가능한 모델이 없습니다.");
  return usable[0].name.replace(/^models\//, "");
}

async function gemFill(words) {
  const key = (S.settings.geminiKey || "").trim();
  if (!key) throw new Error("NOKEY");
  if (!S.settings.geminiModel) { S.settings.geminiModel = await gemPickModel(key); save(); }
  const prompt =
    "다음 영어 단어들의 한국 중·고등학생용 학습 카드를 만들어 주세요.\n\n" +
    "각 단어마다:\n" +
    "- w: 주어진 영어 단어 그대로\n" +
    "- m: 한국어 뜻 1~3개, 쉼표로 구분\n" +
    "- p: 품사 (동사/명사/형용사/부사 등)\n" +
    "- e: 그 단어가 들어간 8~12단어의 자연스러운 영어 예문\n" +
    "- h: 어원 분해나 짧은 연상법, 한국어 40자 이내 (쉬운 단어는 빈 문자열)\n\n" +
    "단어 목록:\n" + words.join("\n");

  const r = await fetch(GEM_BASE + "/models/" + S.settings.geminiModel + ":generateContent?key=" + encodeURIComponent(key), {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { responseMimeType: "application/json", responseSchema: GEM_SCHEMA, temperature: 0.3 },
    }),
  });
  if (!r.ok) {
    let msg = ""; try { const j = await r.json(); msg = (j.error || {}).message || ""; } catch (e) {}
    if (r.status === 400 && /API key/i.test(msg)) throw new Error("KEYBAD");
    if (r.status === 403) throw new Error("KEYBAD");
    if (r.status === 429) throw new Error("무료 사용량을 다 썼습니다. 잠시 후 다시 시도해 주세요.");
    if (r.status === 404) { S.settings.geminiModel = ""; save(); throw new Error("모델을 찾지 못했습니다. 다시 시도해 주세요."); }
    throw new Error("오류 " + r.status + (msg ? " · " + msg : ""));
  }
  const j = await r.json();
  const txt = (((j.candidates || [])[0] || {}).content || {}).parts;
  if (!txt || !txt.length) throw new Error("응답이 비어 있습니다.");
  return JSON.parse(txt[0].text);
}

/* ========== 화면 공통 ========== */
const app = document.getElementById("app");
const tabsEl = document.getElementById("tabs");
let tab = "home";
const TABS = [
  { id: "home", ico: "🏠", lbl: "홈" },
  { id: "library", ico: "📚", lbl: "보관함" },
  { id: "stats", ico: "📊", lbl: "통계" },
  { id: "settings", ico: "⚙️", lbl: "설정" },
];
function showTabs(v) {
  tabsEl.style.display = v ? "" : "none";
  tabsEl.innerHTML = TABS.map(t => `<button class="${t.id===tab?"on":""}" onclick="go('${t.id}')"><span class="ico">${t.ico}</span>${t.lbl}</button>`).join("");
}
function go(t) {
  tab = t;
  if (t === "home") renderHome();
  else if (t === "library") renderLibrary();
  else if (t === "stats") renderStats();
  else if (t === "settings") renderSettings();
}
function esc(s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function shuffle(a) { a = [...a]; for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function boldWord(sent, w) {
  const base = w.split("/")[0].trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  try { return esc(sent).replace(new RegExp("(" + base + "\\w*)", "i"), "<b>$1</b>"); } catch (e) { return esc(sent); }
}

async function doGemFill() {
  const blanks = CONF.cards.filter(c => !String(c.m || "").trim());
  if (!blanks.length) return;
  if (!(S.settings.geminiKey || "").trim()) {
    alert("설정에서 제미나이 API 키를 먼저 입력해 주세요. 무료로 발급받을 수 있습니다.");
    go("settings"); return;
  }
  const btn = document.getElementById("gemBtn");
  if (btn) { btn.disabled = true; btn.textContent = "제미나이가 뜻을 만드는 중…"; }
  try {
    const got = await gemFill(blanks.map(c => c.w));
    const byWord = {};
    for (const g of got) if (g && g.w) byWord[String(g.w).toLowerCase().trim()] = g;
    let n = 0;
    for (const c of CONF.cards) {
      const g = byWord[c.w.toLowerCase().trim()];
      if (!g || String(c.m || "").trim()) continue;
      c.m = g.m || ""; c.p = c.p || g.p || ""; c.e = c.e || g.e || ""; c.h = c.h || g.h || "";
      if (c.m) { S.userDict[c.w.toLowerCase()] = { m: c.m, p: c.p, e: c.e, h: c.h }; n++; }
    }
    save();
    renderConfirmBody();
    if (!n) alert("뜻을 받지 못했습니다. 다시 시도해 주세요.");
  } catch (e) {
    let msg = e.message;
    if (msg === "NOKEY") msg = "설정에서 제미나이 API 키를 입력해 주세요.";
    else if (msg === "KEYBAD") msg = "API 키가 올바르지 않습니다. 설정에서 다시 확인해 주세요.";
    else if (/Failed to fetch|NetworkError/i.test(msg)) msg = "인터넷 연결을 확인해 주세요.";
    alert(msg);
    renderConfirmBody();
  }
}

/* 공유하기로 들어온 텍스트 처리 (Android 공유 메뉴 / iOS 단축어 / 링크) */
function handleShared() {
  const q = new URLSearchParams(location.search);
  const txt = [q.get("text"), q.get("title"), q.get("url")].filter(Boolean).join("\n").trim();
  if (!txt) return false;
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  const cards = parsePasted(txt);
  if (cards.length) renderConfirm("공유받은 단어 · " + today(), cards);
  else renderPaste(txt, "공유받은 글에서 영어 단어를 찾지 못했습니다. 내용을 확인하고 고쳐 주세요.");
  return true;
}

const HEADER_WORDS = /^(no|num|word|words|meaning|means|day|unit|page|test|name|class|date)$/i;
function parsePasted(text) {
  const re = /([A-Za-z][A-Za-z'’\-]*(?:\s*\/\s*[A-Za-z][A-Za-z'’\-]*)*)|([(（[]?[가-힣][^A-Za-z0-9\n]*)/g;
  const cards = [];
  let cur = null;
  const push = () => { if (cur && cur.w) cards.push(cur); cur = null; };
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    let m; re.lastIndex = 0;
    while ((m = re.exec(line))) {
      if (m[1]) {
        const w = m[1].replace(/\s*\/\s*/g, "/").trim();
        if (w.length < 2 && !/^[ai]$/i.test(w)) continue;
        if (HEADER_WORDS.test(w)) continue;
        push();
        cur = { w: w, m: "", p: "", e: "", h: "" };
      } else if (m[2]) {
        const ko = m[2].replace(/[\s·]+$/, "").trim();
        if (!ko) continue;
        if (cur) cur.m = cur.m ? cur.m + ", " + ko : ko;
        else if (cards.length && !cards[cards.length - 1].m) cards[cards.length - 1].m = ko;
      }
    }
    push();
  }
  // 중복 제거 + 내장 사전에서 뜻·예문·어원 자동 채우기
  const seen = new Set(); const out = [];
  for (const c of cards) {
    const k = c.w.toLowerCase();
    if (seen.has(k)) continue; seen.add(k);
    const d = lookup(c.w);
    if (d) { if (!c.m) c.m = d.m; c.p = d.p || ""; c.e = d.e || ""; c.h = d.h || ""; }
    out.push(c);
  }
  return out;
}

function doParse() {
  const el = document.getElementById("pasteIn");
  const cards = parsePasted(el ? el.value : "");
  if (!cards.length) { alert("영어 단어를 찾지 못했습니다. 붙여넣은 내용을 확인해 주세요."); return; }
  renderConfirm("붙여넣은 단어 · " + today(), cards);
}

/* ========== 학습 세션 (활성 묶음) ========== */
let L = null;
function startLearn() {
  const b = activeBatch(); if (!b) { go("home"); return; }
  const st = batchStats(b);
  if (st.left === 0) { renderBatchDone(b); return; }
  let quota = newLeft();
  const q = [];
  b.cards.forEach((c, i) => {
    const p = P(b.id, i);
    if (p.mastered) return;
    if (p.seen) q.push(i);
    else if (quota > 0) { q.push(i); quota--; }
  });
  if (!q.length) {
    app.innerHTML = `<div class="summary card"><div class="emoji">☀️</div><h2>오늘 몫을 다 했어요</h2>
      <p>새 단어는 하루 ${S.settings.newPerDay}개까지만 소개합니다.<br>내일 이어서 하면 훨씬 오래 기억에 남습니다.</p>
      <div class="actions"><button class="btn ghost" onclick="bumpQuota()">그래도 더 할래요</button>
      <button class="btn primary" onclick="go('home')">홈으로</button></div></div>`;
    showTabs(false); return;
  }
  L = { b, queue: shuffle(q), step: 1, said: 0, doneCount: 0, startLeft: st.left };
  renderLearn();
}
function bumpQuota() { S.newCount = Math.max(0, S.newCount - 10); save(); startLearn(); }

function renderLearn() {
  if (!L || !L.queue.length) { return renderLearnSummary(); }
  showTabs(false);
  const b = L.b, i = L.queue[0], c = b.cards[i], p = P(b.id, i);
  const st = batchStats(b);
  const pct = Math.round(st.mastered / st.total * 100);
  const head = `<div class="session-head"><span>${esc(b.name)} · ${st.mastered}/${st.total} 완료</span><button onclick="endSession()">그만하기</button></div>
    <div class="progress"><i style="width:${pct}%"></i></div>`;
  const ex = c.e ? `<p class="example">${boldWord(c.e, c.w)}</p>` : "";
  const ipa = c.ipa ? `<div class="ipa">${esc(c.ipa)}</div>` : "";
  const stars = `<div class="mstars">${"★".repeat(p.streak)}${"☆".repeat(Math.max(0, S.settings.mastery - p.streak))}</div>`;

  if (!p.seen) {
    if (L.step === 1) {
      app.innerHTML = head + `<div class="word-card"><span class="step-tag">1단계 · 문맥에서 만나기</span>
        <div class="word">${esc(c.w)}</div>${ipa}<div class="pos">${esc(c.p)}</div>${ex}
        <button class="speak-btn" onclick="say()">🔊</button>
        <p class="muted" style="margin-top:11px">예문을 보고 뜻을 먼저 추측해 보세요.</p></div>
        <div class="actions"><button class="btn primary" onclick="L.step=2;renderLearn()">뜻 확인하기</button></div>`;
      say();
    } else if (L.step === 2) {
      app.innerHTML = head + `<div class="word-card"><span class="step-tag">2단계 · 뜻과 연결고리</span>
        <div class="word">${esc(c.w)}</div>${ipa}<div class="pos">${esc(c.p)}</div>
        <div class="meaning">${esc(c.m)}</div>${ex}
        ${c.h ? `<div class="hint">💡 ${esc(c.h)}</div>` : ""}</div>
        <div class="actions"><button class="btn primary" onclick="L.step=3;L.said=0;renderLearn()">발음 연습하기</button></div>`;
    } else if (L.step === 3) {
      const dots = Array.from({length:5}, (_, k) => `<div class="say-dot ${k<L.said?"done":""}">${k<L.said?"✓":k+1}</div>`).join("");
      app.innerHTML = head + `<div class="word-card"><span class="step-tag">3단계 · 입으로 각인</span>
        <div class="word">${esc(c.w)}</div>${ipa}
        <div class="meaning" style="font-size:17px">${esc(c.m)}</div>
        <button class="speak-btn" onclick="say()">🔊</button>
        <p class="muted" style="margin-top:11px">듣고 소리 내어 따라 한 뒤 버튼을 누르세요.</p>
        <div class="say-counter">${dots}</div></div>
        <div class="actions"><button class="btn ghost" onclick="saidOnce()">따라 말했어요 (${L.said}/5)</button>
        ${L.said>=5?`<button class="btn primary" onclick="L.step=4;renderLearn()">퀴즈로</button>`:""}</div>`;
    } else {
      quizScreen(c, head, "4단계 · 스스로 꺼내보기", false, (ok) => afterAnswer(ok));
    }
  } else {
    quizScreen(c, head, "다시 확인하기", true, (ok) => afterAnswer(ok), stars);
  }
}
function say() { const c = L.b.cards[L.queue[0]]; speak(c.w, c.audio); }
function saidOnce() { say(); L.said = Math.min(5, L.said + 1); renderLearn(); }

function afterAnswer(ok) {
  const b = L.b, i = L.queue.shift(), p = P(b.id, i);
  p.seen = true;
  if (!p.reps) { S.newCount++; }
  p.reps++;
  if (ok) {
    p.streak++;
    if (p.streak >= S.settings.mastery) { p.mastered = true; p.iv = 1; p.due = addDays(1); L.doneCount++; }
    else L.queue.splice(Math.min(L.queue.length, 3), 0, i);
  } else {
    p.streak = 0; p.lapses++;
    L.queue.splice(Math.min(L.queue.length, 2), 0, i);
  }
  touchStreak(); save();
  L.step = 1; L.said = 0;
  if (batchStats(b).left === 0) return renderBatchDone(b);
  renderLearn();
}

/* ========== 퀴즈 공통 ========== */
function poolCards() {
  const out = [];
  for (const b of Object.values(S.batches)) for (const c of b.cards) out.push(c);
  if (out.length < 8) for (const sid of BUILTIN_ORDER) { const s = BUILTIN[sid]; if (s) out.push(...s.cards); }
  return out;
}
function quizScreen(card, headHtml, tagText, blue, onDone, extraHtml) {
  const pool = poolCards().filter(x => x.m && x.m !== card.m);
  const wrongs = shuffle(pool).slice(0, 3).map(x => x.m);
  while (wrongs.length < 3) wrongs.push("(보기 없음)");
  const choices = shuffle([card.m, ...wrongs]);
  let answered = false;
  window.__pick = (btn, m) => {
    if (answered) return; answered = true;
    const ok = m === card.m;
    document.querySelectorAll(".choice").forEach(x => {
      x.disabled = true;
      if (x.dataset.m === card.m) x.classList.add("right");
      else if (x === btn && !ok) x.classList.add("wrong");
    });
    document.getElementById("fb").innerHTML = ok
      ? `<button class="btn primary" onclick="__next(true)">잘했어요! 다음 →</button>`
      : `<div class="hint" style="display:block">💡 ${esc(card.h||"")}${card.h?"<br>":""}<b>${esc(card.w)}</b> = ${esc(card.m)}${card.e?"<br>"+esc(card.e):""}</div>
         <button class="btn warn" onclick="__next(false)">다시 볼게요, 다음 →</button>`;
    if (!ok) speak(card.w, card.audio);
  };
  window.__next = (ok) => onDone(ok);
  const ipa = card.ipa ? `<div class="ipa">${esc(card.ipa)}</div>` : "";
  app.innerHTML = headHtml + `
    <div class="word-card"><span class="step-tag ${blue?"b":""}">${esc(tagText)}</span>
      <div class="word">${esc(card.w)}</div>${ipa}<div class="pos">${esc(card.p)}</div>
      <button class="speak-btn" onclick="speak('${esc(card.w).replace(/'/g,"\\'")}', ${card.audio?`'${esc(card.audio)}'`:"null"})">🔊</button>
      ${extraHtml || ""}
      <p class="muted" style="margin-top:9px">뜻을 먼저 떠올린 뒤 고르세요.</p></div>
    <div class="choices">${choices.map(m => `<button class="choice" data-m="${esc(m)}" onclick="__pick(this,this.dataset.m)">${esc(m)}</button>`).join("")}</div>
    <div class="actions" id="fb"></div>`;
  if (blue) speak(card.w, card.audio);
}
function endSession() { L = null; R = null; go("home"); }

/* ========== 보관함 ========== */
function renderLibrary() {
  showTabs(true);
  const all = Object.values(S.batches).sort((a,b) => (b.created||"").localeCompare(a.created||""));
  const mine = all.map(b => {
    const st = batchStats(b);
    const isActive = S.active === b.id;
    const label = isActive ? "이어서" : (b.done ? "다시" : "시작");
    return `<div class="listrow"><div class="info">
        <div class="nm">${esc(b.name)}${isActive?" · 진행 중":""}</div>
        <div class="sub">${st.mastered}/${st.total} 완료 · ${esc(b.created)}${b.done?" · 복습 중":""}</div>
      </div>
      <button class="go ${b.done?"gray":""}" onclick="openBatch('${b.id}')">${label}</button>
      <button class="del" onclick="delBatch('${b.id}')">✕</button></div>`;
  }).join("") || `<p class="muted">아직 만든 묶음이 없습니다. 홈에서 단어를 추가해 보세요.</p>`;

  const builtin = BUILTIN_ORDER.filter(s => BUILTIN[s]).map(sid => {
    const s = BUILTIN[sid];
    const exists = Object.values(S.batches).find(b => b.src === sid);
    const st = exists ? batchStats(exists) : null;
    return `<div class="listrow"><div class="info">
        <div class="nm">${esc(s.name)}</div>
        <div class="sub">${st ? st.mastered+"/"+st.total+" 완료" : s.cards.length + "개 단어"}</div>
      </div>
      <button class="go ${st?"gray":""}" onclick="useBuiltin('${sid}')">${st ? "이어서" : "시작"}</button></div>`;
  }).join("");

  app.innerHTML = `
    <header class="top"><h1>보관함</h1></header>
    <div class="card"><h2>내가 만든 묶음</h2>${mine}</div>
    <div class="card"><h2>에린데일 기본 단어장</h2>${builtin}</div>`;
}
function openBatch(id) {
  const b = S.batches[id]; if (!b) return;
  if (b.done) { if (!confirm(`"${b.name}"을(를) 다시 외울까요? 진행 기록이 초기화됩니다.`)) return; return resetBatch(id); }
  S.active = id; save(); go("home"); setTimeout(startLearn, 60);
}
function delBatch(id) {
  const b = S.batches[id]; if (!b) return;
  if (!confirm(`"${b.name}"을(를) 삭제할까요? 학습 기록도 함께 사라집니다.`)) return;
  b.cards.forEach((c, i) => delete S.prog[id + "#" + i]);
  delete S.batches[id];
  if (S.active === id) S.active = null;
  save(); renderLibrary();
}
function useBuiltin(sid) {
  let b = Object.values(S.batches).find(x => x.src === sid);
  if (!b) {
    const s = BUILTIN[sid];
    const id = "b" + Date.now();
    b = { id, src: sid, name: s.name, created: today(), cards: s.cards.map(c => ({...c})), done: false };
    S.batches[id] = b;
    enrichBatch(b);
  }
  if (b.done) { if (!confirm(`"${b.name}"을(를) 다시 외울까요?`)) return; return resetBatch(b.id); }
  S.active = b.id; save(); go("home"); setTimeout(startLearn, 60);
}

/* ========== 통계 ========== */
function renderStats() {
  showTabs(true);
  let total = 0, mastered = 0, lt = 0, lapses = 0;
  for (const b of Object.values(S.batches)) {
    total += b.cards.length;
    b.cards.forEach((c, i) => { const p = S.prog[b.id+"#"+i]; if (!p) return;
      if (p.mastered) mastered++; if (p.iv >= 30) lt++; lapses += p.lapses || 0; });
  }
  const due = dueList().length;
  const stages = { "1일": 0, "3일": 0, "7일": 0, "30일+": 0 };
  Object.values(S.prog).forEach(p => { if (!p.mastered) return;
    if (p.iv >= 30) stages["30일+"]++; else if (p.iv >= 7) stages["7일"]++; else if (p.iv >= 3) stages["3일"]++; else stages["1일"]++; });
  const max = Math.max(1, ...Object.values(stages));
  const bars = Object.entries(stages).map(([k,v]) =>
    `<div class="listrow" style="border:none;padding:5px 0"><span style="flex:0 0 74px;font-size:14px">${k} 간격</span>
     <span class="bar" style="flex:1"><i style="width:${Math.round(v/max*100)}%"></i></span>
     <span class="muted" style="flex:0 0 34px;text-align:right">${v}</span></div>`).join("");
  app.innerHTML = `
    <header class="top"><h1>학습 통계</h1><span class="streak">🔥 ${S.streak}일 연속</span></header>
    <div class="stat-grid">
      <div class="stat"><div class="v">${mastered}</div><div class="k">외운 단어 (전체 ${total})</div></div>
      <div class="stat"><div class="v">${lt}</div><div class="k">장기기억 단계 (30일 도달)</div></div>
      <div class="stat"><div class="v">${due}</div><div class="k">오늘 복습 대기</div></div>
      <div class="stat"><div class="v">${lapses}</div><div class="k">누적 오답 횟수</div></div>
    </div>
    <div class="card" style="margin-top:14px"><h2>기억 단계 분포</h2>${bars}
      <p class="muted" style="margin-top:8px">30일 간격까지 통과한 단어는 해마의 단기기억에서 대뇌피질의 장기기억으로 옮겨간 것입니다.</p></div>`;
}

/* ========== 설정 ========== */
function renderSettings() {
  showTabs(true);
  app.innerHTML = `
    <header class="top"><h1>설정</h1></header>
    <div class="card">
      <h2>제미나이로 뜻 자동 채우기 <span class="muted">· 무료</span></h2>
      ${S.settings.geminiKey
        ? `<div class="ok-notice">키가 등록되어 있습니다${S.settings.geminiModel ? " · " + esc(S.settings.geminiModel) : ""}</div>`
        : `<p class="muted" style="margin-bottom:9px">단어 확인 화면에서 <b>뜻을 한 번에 채워주는</b> 기능입니다.
           구글 AI 스튜디오에서 <b>신용카드 없이</b> 무료로 키를 받을 수 있습니다.</p>`}
      <input type="password" id="gemKeyIn" placeholder="AIza..." style="width:100%">
      <div class="actions" style="margin-top:10px">
        <button class="btn primary" onclick="saveGemKey()">키 저장</button>
        ${S.settings.geminiKey ? `<button class="btn ghost" onclick="clearGemKey()">키 삭제</button>` : ""}
      </div>
      <p class="muted" style="margin-top:10px">키는 이 기기 안에만 저장됩니다.
      <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="color:var(--accent)">무료 키 발급받기 →</a></p>
    </div>
    <div class="card">
      <h2>학습</h2>
      <div class="setting-row"><span>하루 새 단어 <span class="muted">(10~20 권장)</span></span>
        <select onchange="S.settings.newPerDay=+this.value;save()">
          ${[5,10,15,20,30,50].map(n=>`<option value="${n}" ${S.settings.newPerDay===n?"selected":""}>${n}개</option>`).join("")}
        </select></div>
      <div class="setting-row"><span>몇 번 맞혀야 완료</span>
        <select onchange="S.settings.mastery=+this.value;save()">
          ${[2,3,4].map(n=>`<option value="${n}" ${S.settings.mastery===n?"selected":""}>연속 ${n}번</option>`).join("")}
        </select></div>
      <div class="setting-row"><span>발음 속도</span>
        <select onchange="S.settings.ttsRate=+this.value;save()">
          ${[[0.7,"느리게"],[0.9,"보통"],[1.1,"빠르게"]].map(([v,l])=>`<option value="${v}" ${S.settings.ttsRate===v?"selected":""}>${l}</option>`).join("")}
        </select></div>
      <div class="setting-row"><span>원어민 발음 사용 <span class="muted">(무료 사전)</span></span>
        <input type="checkbox" ${S.settings.useDictApi?"checked":""} onchange="S.settings.useDictApi=this.checked;save()" style="width:20px;height:20px"></div>
    </div>
    <div class="card">
      <h2>데이터</h2>
      <div class="setting-row"><span>학습 기록 복사</span><button class="btn ghost" style="width:auto;padding:8px 14px;font-size:14px" onclick="exportData()">복사</button></div>
      <div class="setting-row"><span class="muted">모든 기록 삭제</span><button class="danger-link" onclick="resetAll()">초기화</button></div>
    </div>`;
}
async function saveGemKey() {
  const el = document.getElementById("gemKeyIn");
  const v = (el ? el.value : "").trim();
  if (!v) { alert("키를 입력해 주세요."); return; }
  const btn = document.querySelector('button[onclick="saveGemKey()"]');
  if (btn) { btn.disabled = true; btn.textContent = "확인 중…"; }
  try {
    const model = await gemPickModel(v);
    S.settings.geminiKey = v; S.settings.geminiModel = model; save();
    renderSettings();
    alert("연결됐습니다. 이제 단어 확인 화면에서 뜻을 자동으로 채울 수 있습니다.");
  } catch (e) {
    alert(e.message === "KEYBAD" ? "키가 올바르지 않습니다. 다시 확인해 주세요." : e.message);
    renderSettings();
  }
}
function clearGemKey() {
  if (confirm("저장된 제미나이 키를 삭제할까요?")) { S.settings.geminiKey = ""; S.settings.geminiModel = ""; save(); renderSettings(); }
}
function exportData() { navigator.clipboard.writeText(localStorage.getItem(KEY) || "").then(() => alert("학습 기록을 클립보드에 복사했습니다.")).catch(() => alert("복사에 실패했습니다.")); }
function resetAll() { if (confirm("모든 묶음과 학습 기록을 삭제할까요? 되돌릴 수 없습니다.")) { localStorage.removeItem(KEY); S = load(); go("home"); } }

/* 시작 */
if (!handleShared()) go("home");
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
